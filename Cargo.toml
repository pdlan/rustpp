[workspace]
members = [
    "crates/rustpp_compiler",
    "crates/rustpp_cli",
    "crates/rustpp_ast_codegen",
    "examples/value_class_demo",
    "examples/ordinary_class_demo",
    "examples/http_server_demo",
    "examples/object_model_comparison",
    "examples/lifecycle_comparison",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
proc-macro2 = "1"
quote = "1"
rowan = "0.16"
serde_json = "1"
syn = { version = "2", features = ["full", "fold", "visit"] }
